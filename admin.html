<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel de peticiones</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header>
  <img src="/icons/icon-192.png" alt="Escudo de MVI El Reino de los Cielos">
  <div><h1>Panel de peticiones</h1><p>Solo para el pastor y quienes administran</p></div>
</header>
<main>

<section id="entrar" class="pantalla activa">
  <h2>Entrar</h2>
  <label for="clave">Contraseña del panel</label>
  <input id="clave" type="password" autocomplete="current-password">
  <p id="errorEntrar" class="error" role="alert"></p>
  <button class="principal" id="btnEntrar" type="button">Entrar</button>
</section>

<section id="panel" class="pantalla">
  <label for="modulo">Módulo</label>
<select id="modulo">
  <option value="peticiones">Gestión de Peticiones</option>
  <option value="testimonios">Gestión de Testimonios</option>
</select>
  <label for="filtro">Mostrar</label>
  <select id="filtro">
    <option value="todas">Todas</option>
    <option value="no contestada">Sin contestar</option>
    <option value="contestada">Contestadas</option>
  </select>
  <p id="cuenta" class="nota"></p>
  <div id="lista"></div>
  <button class="secundario" id="btnSalir" type="button">Cerrar sesión</button>
</section>

</main>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, signInWithCustomToken, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, onValue, update, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

const app = initializeApp({
  apiKey: 'AIzaSyAJ8ObKdI2xzw5o51h1BgDWPvnIxoS6xrk',
  authDomain: 'peticiones-mvi.firebaseapp.com',
  databaseURL: 'https://peticiones-mvi-default-rtdb.firebaseio.com',
  projectId: 'peticiones-mvi',
  appId: '1:570960184669:web:d75cda51c83be56eca94b4',
});

const auth = getAuth(app);
const db = getDatabase(app);
let peticiones = [];
let testimonios = [];
let pararPeticiones = null;
let pararTestimonios = null;

const $ = (id) => document.getElementById(id);
const el = (tag, texto, clase) => {
  const e = document.createElement(tag);
  if (texto !== undefined) e.textContent = texto;
  if (clase) e.className = clase;
  return e;
};
const mostrar = (id) => document.querySelectorAll('.pantalla').forEach((s) => s.classList.toggle('activa', s.id === id));

$('btnEntrar').onclick = async () => {$('errorEntrar').textContent = '';
  try {
    const r = await fetch('/api/admin-login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ clave: $('clave').value }),
    });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || 'No se pudo entrar.');
    await signInWithCustomToken(auth, j.token);
    $('clave').value = '';
  } catch (err) {
    $('errorEntrar').textContent = err.message;
  }
};

$('btnSalir').onclick = () => signOut(auth);

// Repintar al cambiar de opciones
$('filtro').onchange = () => pintarVista();$('modulo').onchange = () => {
  $('filtro').style.display =$('modulo').value === 'testimonios' ? 'none' : 'block';
  pintarVista();
};

onAuthStateChanged(auth, (usuario) => {
  if (pararPeticiones) { pararPeticiones(); pararPeticiones = null; }
  if (pararTestimonios) { pararTestimonios(); pararTestimonios = null; }
  
  if (!usuario) { mostrar('entrar'); return; }
  mostrar('panel');

  // Escuchar Peticiones
  pararPeticiones = onValue(ref(db, 'peticiones'), (snap) => {
    const datos = snap.val() || {};
    peticiones = Object.entries(datos).map(([id, p]) => ({ id, ...p })).sort((a, b) => b.fecha - a.fecha);
    if($('modulo').value === 'peticiones') pintarVista();
  });

  // Escuchar Testimonios
  pararTestimonios = onValue(ref(db, 'testimonios'), (snap) => {
    const datos = snap.val() || {};
    testimonios = Object.entries(datos).map(([id, p]) => ({ id, ...p })).sort((a, b) => b.fecha - a.fecha);
    if($('modulo').value === 'testimonios') pintarVista();
  });
});

function pintarVista() {
  if ($('modulo').value === 'peticiones') {
    const f = $('filtro').value;
    const ver = peticiones.filter((p) => f === 'todas' || p.estado === f);
    $('cuenta').textContent = `${ver.length} petición(es)`;
    $('lista').replaceChildren(...ver.map(tarjetaPeticion));
  } else {
    $('cuenta').textContent = `${testimonios.length} testimonio(s) públicos`;
    $('lista').replaceChildren(...testimonios.map(tarjetaTestimonio));
  }
}

// TARJETA DE TESTIMONIOS (CON BOTÓN ELIMINAR)
function tarjetaTestimonio(t) {
  const fila = el('article', undefined, 'fila-admin');
  fila.append(
    el('small', `${new Date(t.fecha).toLocaleString('es-MX')} - Público`),
    el('h3', t.nombre),
    el('p', t.texto)
  );

  const btnEliminar = el('button', 'Eliminar Testimonio Definitivamente', 'secundario');
  btnEliminar.style.borderColor = 'var(--alerta)';
  btnEliminar.style.color = 'var(--alerta)';
  btnEliminar.onclick = () => {
    if (confirm('¿Seguro que quieres borrar este testimonio? Desaparecerá de la página pública.')) {
      remove(ref(db, `testimonios/${t.id}`)).catch((err) => alert('No se pudo borrar: ' + err.message));
    }
  };
  
  fila.append(btnEliminar);
  return fila;
}

// TARJETA DE PETICIONES ORIGINAL
// TARJETA DE PETICIONES ACTUALIZADA
function tarjetaPeticion(p) {
  const fila = el('article', undefined, 'fila-admin');
  
  // 1. Detectar si la petición es pública o privada (soporta el código nuevo y viejo)
  const quiereMuro = p.muro === true || p.solicitaMuro === true;
  
  // 2. Crear el encabezado con las etiquetas visuales
  const headerTop = el('div');
  headerTop.style.display = 'flex';
  headerTop.style.justifyContent = 'space-between';
  headerTop.style.marginBottom = '12px';

  const badgePrivacidad = el('span', quiereMuro ? 'PÚBLICA (Muro)' : 'PRIVADA (Solo equipo)');
  badgePrivacidad.style.padding = '4px 10px';
  badgePrivacidad.style.borderRadius = '12px';
  badgePrivacidad.style.fontSize = '0.75rem';
  badgePrivacidad.style.fontWeight = 'bold';
  badgePrivacidad.style.color = 'white';
  badgePrivacidad.style.backgroundColor = quiereMuro ? 'var(--acento, #D4AF37)' : 'var(--texto-suave, #566573)';

  const fechaBadge = el('span', `${new Date(p.fecha).toLocaleString('es-MX')} | Cód: ${p.codigo}`);
  fechaBadge.style.color = 'var(--texto-suave, #73655D)';
  fechaBadge.style.fontSize = '0.8rem';

  headerTop.append(badgePrivacidad, fechaBadge);

  // 3. Etiqueta del Motivo de oración
  const motivo = el('div', `Motivo: ${p.categoria || 'Sin especificar'}`);
  motivo.style.color = 'var(--texto, #1B242C)';
  motivo.style.fontWeight = 'bold';
  motivo.style.fontSize = '0.85rem';
  motivo.style.marginBottom = '8px';

  // 4. Armar el cuerpo de la tarjeta
  const titulo = el('h3', p.nombre || 'Anónimo');
  titulo.style.marginTop = '0';
  const texto = el('p', p.texto);
  const versiculo = el('p', `Versículo asignado: ${p.versiculo?.cita || 'ninguno'}`);
  versiculo.style.fontStyle = 'italic';
  versiculo.style.fontSize = '0.9rem';
  versiculo.style.color = 'var(--texto-suave, #566573)';

  fila.append(headerTop, motivo, titulo, texto, versiculo);

  // 5. Botón de llamada (si dejó teléfono)
  if (p.telefono) {
    const a = el('a', `Llamar a ${p.telefono}`);
    a.href = `tel:${p.telefono}`;
    a.style.display = 'inline-block';
    a.style.marginBottom = '15px';
    a.style.fontWeight = 'bold';
    a.style.color = 'var(--acento, #D4AF37)';
    fila.append(a);
  }

  // 6. Controles de Estado (Contestada / Sin contestar)
  const botonesEstado = el('div', undefined, 'estados');
  for (const op of ['no contestada', 'contestada']) {
    const b = el('button', op === 'contestada' ? 'Contestada 🙏' : 'Sin contestar', op === p.estado ? 'activo' : '');
    b.type = 'button';
    b.onclick = () => {
      const updates = {
        [`peticiones/${p.id}/estado`]: op,
        [`codigos/${p.codigo}/estado`]: op,
      };
      // Solo actualiza el estado en el muro si actualmente está visible ahí
      if (p.visibilidad === 'publicada') updates[`muro/${p.id}/estado`] = op;[cite: 10]
      update(ref(db), updates).catch((err) => alert('No se pudo guardar: ' + err.message));[cite: 10]
    };
    botonesEstado.append(b);
  }

  // 7. Botón del Muro Público
  const btnMuro = el('button', p.visibilidad === 'publicada' ? 'Quitar del Muro Público' : 'Publicar en Muro Público');[cite: 10]
  if (p.visibilidad === 'publicada') {
    btnMuro.className = 'secundario';[cite: 10]
  } else if (quiereMuro) {
    btnMuro.className = 'principal'; // Botón destacado si el usuario lo pidió
  } else {
    btnMuro.className = 'secundario';
    btnMuro.style.opacity = '0.6'; // Botón opaco si es privada, para evitar publicarla por accidente
  }
  
  btnMuro.onclick = () => {
    if (p.visibilidad !== 'publicada') {[cite: 10]
      if (!quiereMuro && !confirm('ATENCIÓN: El usuario pidió que esta petición sea PRIVADA. ¿Seguro que deseas publicarla en el Muro Web?')) return;
      if (quiereMuro && !confirm('¿Seguro de publicar en el Muro Web?')) return;[cite: 10]
      
      update(ref(db), {
        [`peticiones/${p.id}/visibilidad`]: 'publicada',[cite: 10]
        [`muro/${p.id}`]: { texto: p.texto, nombre: p.nombre, anonimo: p.anonimo, fecha: p.fecha, versiculo: p.versiculo, estado: p.estado }[cite: 10]
      }).catch((err) => alert('Error: ' + err.message));[cite: 10]
    } else {
      update(ref(db), {
        [`peticiones/${p.id}/visibilidad`]: 'privada',[cite: 10]
        [`muro/${p.id}`]: null[cite: 10]
      }).catch((err) => alert('Error: ' + err.message));[cite: 10]
    }
  };

  // 8. Notas Pastorales
  const notas = el('textarea');[cite: 10]
  notas.value = p.notas || '';[cite: 10]
  notas.placeholder = 'Notas pastorales... (Ocultas al público)';[cite: 10]
  notas.style.marginTop = '10px';
  notas.onchange = () => update(ref(db, `peticiones/${p.id}`), { notas: notas.value });[cite: 10]
  
  fila.append(botonesEstado, btnMuro, notas);[cite: 10]
  return fila;[cite: 10]
}
